<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap');
  html, body { margin: 0; background: transparent; }
  .stage { width: 512px; height: 512px; position: relative; }
  svg { display: block; }
</style>
</head>
<body>
<div class="stage">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#161f2e"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d9a4"/>
      <stop offset="45%" stop-color="#cda05a"/>
      <stop offset="100%" stop-color="#9c7333"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.55"/>

  <!-- roofline mark -->
  <path d="M 197 178 L 256 128 L 315 178" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="158" r="5.5" fill="url(#gold)"/>

  <!-- monogram: clean, evenly-weighted lockup with a slender divider -->
  <text x="180" y="368" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="800" font-size="196" fill="url(#gold)">S</text>
  <rect x="250" y="230" width="3" height="148" fill="url(#gold)" opacity="0.85"/>
  <text x="330" y="368" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="800" font-size="196" fill="url(#gold)">R</text>
</svg>
</div>
</body>
</html>
